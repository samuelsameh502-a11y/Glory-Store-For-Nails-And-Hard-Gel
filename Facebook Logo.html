   <div id="fb">
    <style>
       #fb {
        background: #1096f4;
        text-indent:  -999em;
        width: 100px;
        height: 110px;
        box-sizing: content-box;
        border-radius: 5px;
        position: relative;
        overflow: hidden;
        border: 15px solid #1096f4;
        border-bottom: 0;
       }
       #fb:before {
        content: "/20";
        position: absolute;
        background: #1096f4;
        width: 40px;
        height: 90px;
        bottom: -30px;
        right: -37px;
        border: 20px solid #eee;
        border-radius: 25px;
        box-sizing: content-box;
       }
       #fb:after {
        content: "/20";
        position: absolute;
        width: 55px;
        top: 50px;
        height: 20px;
        background: #eee;
        right: 5px;
        box-sizing: content-box;
       }
