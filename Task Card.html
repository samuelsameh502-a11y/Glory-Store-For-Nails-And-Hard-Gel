<!DOCTYPE html>
<html lang="en">
<head>

  <title>Plan Your Trip Card</title>
  <link rel="stylesheet" href="Trip Card.css">
</head>
<body>

  <div class="card">
    <div class="icon-container">
      <svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="10"></circle>
        <path d="M12 2a14.5 14.5 0 0 0 0 20 14.5 14.5 0 0 0 0-20"></path>
        <path d="M2 12h20"></path>
        <path d="M17.8 8.2 6.2 15.8"></path>

    </div>

    <h2 class="card-title">Plan Your Trip</h2>

      Find the best destinations, plan your perfect trip and enjoy amazing deals with us.
    </p>

    <button class="card-btn">Learn More</button>
  </div>

</html>
