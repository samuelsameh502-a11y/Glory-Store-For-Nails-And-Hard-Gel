<!DOCTYPE html>
<html>
<head>
    <title>Table Example</title>
    <style>
        table, th, td {
            border: 1px solid black;
            border-collapse: collapse;
            padding: 5px;
            text-align: left;
        }
    </style>
</head>
<body>

    <h3>Table</h3>

    <table>
        <tr>
            <th>Name</th>
            <th>Age</th>
            <th>City</th>
        </tr>
        <tr>
            <td>Ali</td>
            <td>15</td>
            <td>Cairo</td>
        </tr>
        <tr>
            <td>Sara</td>
            <td>14</td>
            <td>Giza</td>
        </tr>
    </table>
</body>
</html>
