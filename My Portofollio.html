<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Portfolio</title>
    <link rel="stylesheet" href="Samuel Sameh.css">
</head>
<body>

    <header class="portfolio-header">
        <h1>My Portfolio</h1>
        <p>Welcome to my personal website</p>
    </header>

    <main class="portfolio-container">
        
        <section class="portfolio-card">
            <h2>About Me</h2>
            <p>My name is <strong>Samuel</strong></p>
            <p>I am a <span class="highlight">Web Developer Learner</span>.</p>
            <div class="profile-image-placeholder">
                📷 My Photo
            </div>
        </section>

        <section class="portfolio-card">
            <h2>Skills</h2>
            <ul class="skills-list">
                <li>HTML</li>
                <li>CSS</li>
                <li>Problem Solving</li>
            </ul>
        </section>

        <section class="portfolio-card">
            <h2>Education</h2>
            <table class="education-table">
                <thead>
                    <tr>
                        <th>Year</th>
                        <th>Study</th>
                        <th>Grade</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td>2024</td>
                        <td>Web Development</td>
                        <td>A</td>
                    </tr>
                </tbody>
            </table>
        </section>

    </main>

</body>
</html>
